# first matching rule wins. catch all encrypts every value, so a path that
# misses the k8s rule ends up more encrypted, never less
creation_rules:
  # k8s secrets: only data/stringData get encrypted so kind/metadata stay readable
  - path_regex: (^|/)(platform|bootstrap)/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: age1xdjq38y4ct4fp38fan7x2kme25g0n64s4z7a6djt40guqrygh9kq7xjf5n

  # everything else (eg tf secrets): every value encrypted
  - path_regex: \.sops\.ya?ml$
    age: age1xdjq38y4ct4fp38fan7x2kme25g0n64s4z7a6djt40guqrygh9kq7xjf5n
