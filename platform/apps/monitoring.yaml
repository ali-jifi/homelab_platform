apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.11.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/platform/monitoring/values.yaml
    - repoURL: git@github.com:ali-jifi/homelab_platform.git
      targetRevision: main
      ref: values
    # grafana admin secret, decrypted by ksops
    - repoURL: git@github.com:ali-jifi/homelab_platform.git
      targetRevision: main
      path: platform/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # prometheus operator CRDs are too big for client side apply (lol)
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
