apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  sources:
    # The chart expects a precreated Secret named operator-oauth (keys client_id, client_secret).
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.104.1
      helm:
        releaseName: tailscale-operator
    # That Secret, decrypted from Git by KSOPS.
    - repoURL: git@github.com:ali-jifi/homelab_platform.git
      targetRevision: main
      path: platform/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
