apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.3
      helm:
        releaseName: cilium
        valueFiles:
          - $values/platform/cilium/values.yaml
    - repoURL: git@github.com:ali-jifi/homelab_platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # No prune: a bad commit must not be able to delete the cluster network.
  syncPolicy:
    automated:
      selfHeal: true
