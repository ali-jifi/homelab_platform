# Cilium 1.20.3 on k3s. Used by the bootstrap `helm install` and later by the Argo CD Application.

# kube-proxy is disabled in k3s, so Cilium handles Services and must reach the API server directly.
kubeProxyReplacement: true
k8sServiceHost: 192.168.0.201
k8sServicePort: 6443

# Matches k3s's default pod CIDR (per the Cilium k3s guide).
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]

# The default "helm" method makes new certs on every render, so Argo CD would never see it in sync.
hubble:
  tls:
    auto:
      method: cronJob

# Two nodes and tight RAM: one operator replica is enough.
operator:
  replicas: 1
