# cilium 1.20.3 on k3s, used by the bootstrap `helm install` + later the argo app

# kube-proxy is off in k3s so cilium handles services and has to hit the API server directly
kubeProxyReplacement: true
k8sServiceHost: 192.168.0.201
k8sServicePort: 6443

# matches k3s default pod CIDR (per cilium's k3s guide)
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]

# default "helm" method makes new certs every render so argo would never be in sync
hubble:
  tls:
    auto:
      method: cronJob

# 2 nodes + tight RAM, 1 operator replica is plenty
operator:
  replicas: 1

# tailscale proxies forward packets to service IPs, which socket LB never sees
socketLB:
  hostNamespaceOnly: true