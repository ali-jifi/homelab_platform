# Argo CD chart 10.10.5 (Argo CD v3.5.5). Used by the bootstrap install and later by Argo CD itself.

# No SSO (dex) or Slack/email notifications needed; saves RAM.
dex:
  enabled: false
notifications:
  enabled: false

# KSOPS: lets kustomize decrypt *.sops.yaml files during rendering.
# Setup follows the KSOPS README (v4.5.1) for the Argo CD Helm chart.
configs:
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

repoServer:
  volumes:
    - name: custom-tools
      emptyDir: {}
    # Created by hand at bootstrap: the age private key, the only secret not stored in Git.
    - name: sops-age
      secret:
        secretName: sops-age

  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools

  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /sops-age
      name: sops-age
      readOnly: true

  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
