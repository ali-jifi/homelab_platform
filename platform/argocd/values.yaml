# argo-cd chart 10.10.5 (argo v3.5.5), used by the bootstrap install + later by argo itself

# no SSO (dex) or notifs needed, saves RAM
dex:
  enabled: false
notifications:
  enabled: false

# tailnet only (TCP proxy via the tailscale operator), argo still serves its own TLS
server:
  service:
    annotations:
      tailscale.com/expose: "true"
      tailscale.com/hostname: argocd

# KSOPS lets kustomize decrypt *.sops.yaml files while rendering
# setup straight from the KSOPS README (v4.5.1) for the argo helm chart
configs:
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

repoServer:
  volumes:
    - name: custom-tools
      emptyDir: {}
    # made by hand at bootstrap: the age private key, only secret not in git
    - name: sops-age
      secret:
        secretName: sops-age

  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools

  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /sops-age
      name: sops-age
      readOnly: true

  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
