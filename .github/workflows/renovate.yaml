name: renovate

on:
  # mondays 11:00 UTC, plus a manual run button
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@v46.3.9
        with:
          # fine grained PAT scoped to this repo only, GITHUB_TOKEN PRs wouldnt trigger CI
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.181.0
        env:
          RENOVATE_REPOSITORIES: ali-jifi/homelab_platform
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: info
